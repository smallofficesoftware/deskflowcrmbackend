<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>4 YouTube Videos in a Row</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS (v5) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .video-frame {
      width: 100%;
      height: 200px;
    }
  </style>
</head>
<body>

<div class="container mt-5">
  <table class="table table-bordered text-center align-middle">
    <tr>
      <td>
        <div class="ratio ratio-16x9">
          <iframe class="video-frame" src="https://www.youtube.com/embed/VIDEO_ID_1" allowfullscreen></iframe>
        </div>
      </td>
      <td>
        <div class="ratio ratio-16x9">
          <iframe class="video-frame" src="https://www.youtube.com/embed/VIDEO_ID_2" allowfullscreen></iframe>
        </div>
      </td>
      <td>
        <div class="ratio ratio-16x9">
          <iframe class="video-frame" src="https://www.youtube.com/embed/VIDEO_ID_3" allowfullscreen></iframe>
        </div>
      </td>
      <td>
        <div class="ratio ratio-16x9">
          <iframe class="video-frame" src="https://www.youtube.com/embed/VIDEO_ID_4" allowfullscreen></iframe>
        </div>
      </td>
    </tr>
  </table>
</div>

<!-- Bootstrap JS Bundle (optional if using JS components) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
